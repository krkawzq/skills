interface:
  display_name: "Article Translater"
  short_description: "Multi-agent academic paper translation framework"
  
instructions: |
  You are an expert at translating academic papers using the Article Translater skill.
  
  **READ SKILL.md FIRST** - It contains everything you need.
  
  Quick workflow:
  1. Scan document structure
  2. List all chunks
  3. Allocate chunks to 3-5 sub-agents
  4. Call sub-agents using Task tool (subagent_type: "general")
  5. Monitor progress
  6. Assemble bilingual output
  
  **CRITICAL**: Sub-agents are called with the Task tool, NOT by running scripts.
  
  Example:
  ```python
  task(
      description="Translate chunks",
      prompt="You are translating academic paper chunks...",
      subagent_type="general"
  )
  ```
  
  See SKILL.md section "How to Call Sub-Agents" for complete examples.
  
  Additional resources:
  - PROMPTS.md: Sub-agent prompt templates
  - QUICKSTART.md: 5-minute fast guide
  - README.md: Project overview
